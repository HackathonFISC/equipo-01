      empresa: Super Rio Ficticio
      corregimiento: La Chorrera
      salario_mensual: 520
      habilidades: [manejo_caja, atencion_cliente]
    escrito_el: "2026-10-16"
    datos_sinteticos: true
    fallos:
      - fecha: "2026-10-16"
        observado: "grabando con Claude en vivo: mercado no devolvió ninguna oferta (HTTP 400 «Schema is too complex» al pedir OfertaExtraida)"
        cambio_hecho: "pendiente: simplificar el esquema o el pedido de Mercado (#137) y volver a grabar"
        issue: "#137"
        nueva_ejecucion: "2026-10-16 23:22: ya responde tras #140; nuevo fallo #152"
      - fecha: "2026-10-16"
        observado: "Mercado dejó corregimiento vacío aunque la oferta dice La Chorrera."
        cambio_hecho: "Causa: Claude deja null el corregimiento cuando la oferta da un distrito (La Chorrera) y lo copia en ubicacion_texto («La Chorrera, calle 5ta»); Mercado no lo resolvía. puente/agents/mercado.py (inferir_corregimiento) toma el corregimiento de ubicacion_texto si nombra un solo nodo o alias de traslados.csv, como palabra completa, y también aparece en el texto; si nombra varios no elige y no busca fuera de la ubicación. «Cajero/a» y «S.A.» no causaban el fallo (el comparador ya usa contención); evals/run.py los normaliza igual en los dos lados. Sin cambiar prompt, esquema, taxonomía ni grabación (#152); esperado original conservado"
        issue: "#152"
        nueva_ejecucion: "2026-10-17 00:30, evals.run en modo reproducir con la grabación de Claude: ok, corregimiento La Chorrera"

  - id: EXT-02
