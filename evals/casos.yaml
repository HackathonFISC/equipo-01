        URGENTE!!! SE BUSCA CAJERO/A  --  Super Rio Ficticio S.A.
        Ubicacion: La Chorrera, calle 5ta. Pago: B/. 520.00 al mes.
        Funciones: cobrar en caja, atender a los clientes, cuadrar la caja al final del turno.
