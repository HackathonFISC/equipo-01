  # ------------------------------------------------------------------ Perfil sin CV (4)
  - id: PER-01
    categoria: perfil_sin_cv
    descripcion: "Yaritza (ficticia), 20 años, La Chorrera, atiende la fonda de su mamá; sin CV."
    entrada:
      respuestas:
        - "Tengo 20 años y vivo en La Chorrera."
