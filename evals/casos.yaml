        - "Por la mañana atiendo la fonda de mi mamá. Atiendo a los clientes, cobro en caja y llevo el control del inventario de lo que se vende."
        - "No he hecho voluntariado."
        - "Me gusta tratar con la gente. Necesito ganar como mínimo 400 al mes."
      formulario: {nombre: Yaritza Ficticia, edad: 20, corregimiento: La Chorrera}
    esperado:
      habilidades: [atencion_cliente, manejo_caja, inventario]
      no_incluir: []
      sin_pii: []
    escrito_el: "2026-10-16"
    datos_sinteticos: true
    fallos: []

