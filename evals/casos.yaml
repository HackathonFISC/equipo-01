# Casos de evaluación de Puente (issue #13).
#
# Reglas del archivo:
# - El resultado "esperado" de cada caso se escribió ANTES de correrlo (campo escrito_el) y se calculó
#   a mano o con la ley en la mano; nunca se copia de lo que devuelve el sistema.
# - Los casos no se borran. Cada fallo se anota en "fallos" con la fecha, lo observado, el cambio
#   hecho, el issue "bug" y la nueva ejecución. El runner (evals/run.py) nunca reescribe este archivo.
# - Todos los datos son SINTÉTICOS: personas, empresas, cédulas y teléfonos son inventados
#   (datos_sinteticos: true). Los traslados y salarios de los casos de matching y sesgo van en línea:
#   NO dependen de data/traslados.csv ni de ninguna otra carpeta data/.
# - Las metas por categoría son PROPUESTAS PROVISIONALES: el issue dice "ver plan" y ese plan no está
#   en el repositorio. El equipo debe confirmarlas.
# - Los skill_id son los de data/taxonomia.csv del issue #3 (atencion_cliente, manejo_caja, inventario,
#   recepcion_mercancia, reposicion_productos, registro_datos, excel_basico, limpieza, ...).
#   Extracción y perfil cargan el mismo catálogo que la demo, sin sinónimos añadidos para estos casos.
# - Reglas legales (Ley 11 de 2005): art. 2 = límite de edad (bloquea); art. 1 = exigencia de sexo
#   (bloquea); "buena presencia", foto y estado civil solo alertan. Falta revisión legal humana.
#
# Formato de las entradas y de lo esperado, por categoría:
#   extraccion_ofertas          entrada.texto -> esperado {puesto, empresa, corregimiento, salario_mensual, habilidades[]}
#   requisitos_discriminatorios entrada {texto, puesto? (#190: el campo Puesto, que se revisa con las mismas reglas)}
#                               -> esperado {bloqueada, reglas[] ("art. 1" | "art. 2"), alertas[] (presencia | foto | estado_civil | sexo_implicito)}
#   perfil_sin_cv               entrada {respuestas[] (hasta 5, en el orden de PREGUNTAS_ENTREVISTA de puente/agents/perfil.py:
#                               1 edad y corregimiento, 2 estudio o trabajo y horario, 3 negocio o ayuda en casa,
#                               4 voluntariado o comunidad, 5 qué sabe hacer y salario mínimo),
#                               formulario {nombre, edad, corregimiento}} -> esperado {habilidades[], no_incluir[], sin_pii[]}
#                               (sin_pii: datos que NO pueden aparecer ni en la evidencia ni en el prompt que recibe el LLM)
#   matching_factible           entrada {config, traslados[], perfiles[], ofertas[]} -> esperado {asignacion{perfil: oferta|null}, violaciones_duras}
#   sesgo_contrafactual         entrada {matching, traslados[], perfiles[], ofertas[]} -> esperado {sesgo_detectado}
#   guardrails                  entrada {tipo, ...} -> esperado {veredicto, llamo_llm?, sigue_como_dato?}
#   horario_tirilla             entrada {ruta (imagen de tests/fixtures), hoy} -> esperado {horario_clases[], problemas[],
#                               vigente_hasta?, excepciones[]? ({desde, hasta})}  (#164, Claude con visión)
#   horario_validacion          entrada {bloques[] (como los leería el LLM)} -> esperado {problemas[] ({indice, campo}),
#                               horario_clases[]}  (#164, solo código)
#   redactor_puente             entrada {oferta | oferta_ruta (.json de tests/fixtures), perfiles[], traslados[], minutos?,
#                               llm_falso? (texto que devuelve un LLM falso; sin él redacta la plantilla del código)}
#                               -> esperado {bloqueada_antes, bloqueada_despues, hallazgos_despues[] (revisar_texto sobre
#                               el puesto y el texto propuestos), cambios[] ({regla, frase}), viables_antes[],
#                               viables_despues[] (ids, calculados a mano con las restricciones duras del solver),
#                               cumplen_filtro_original[]?, redactado_por?, nota_contiene?, texto_contiene[]?,
#                               max_minutos_traslado?, decision_pendiente?}  (#157, sin LLM real)
#   micromision                 entrada {reto_id (de data/retos.csv), texto, perfil?, variantes?} -> esperado {resultado
#                               (correcto | incorrecto | sin respuesta legible), puntaje, respuesta?, datos_personales?
#                               (lo personal que quedó en el scorecard: []), mismo_puntaje? (con variantes)}
#                               (#158, sin LLM: la respuesta sale del respaldo determinístico y la corrige el código)
#   postulacion                 entrada {perfil, oferta, consentimiento (bool), minutos_traslado, sensibles[],
#                               evidencia_presente[]} -> esperado {error (null | "consentimiento"), archivos[] (tipos en
#                               outbox: cv | carta | ics | mensaje), estado (de la postulación o null), datos_sensibles[]
#                               (los de `sensibles` que aparecen en CV, carta, .ics o mensaje), evidencia_presente}
#                               (#7, #12, #212: postular() real con SQLite y outbox temporales, Telegram apagado)
#   reacomodo                   entrada {caso_ruta, config_solver?, habilidades_extra?, evento {oferta_id, perfil_id, tipo,
#                               nota}} -> esperado {excluidos[] ("perfil@oferta (origen)"), postulaciones {"perfil@oferta":
#                               estado}, aviso_al_joven, siguiente[], aprobacion_pendiente, candidatos_nuevos[]}
#                               (#54: el grafo real con Perfil de habilidades fijas, sin LLM)
#   formacion                   entrada {perfil, brechas[], max_minutos?} -> esperado {cursos[] (ids), brechas_cubiertas[],
#                               brechas_pendientes[], violaciones[] (cupo | traslado | pasaje | horario, medidas aparte)}
#                               (#14, #53: catálogo data/cursos.csv y traslados de data/traslados.csv)
#   whatsapp                    entrada {mensajes[], perfil_id? (conversación ya ligada a ese perfil semilla), llm_falso?
#                               ({habilidades[]}), aprobar_despues?} -> esperado {veredicto (marcar | aceptar), marcas[],
#                               perfil_registrado, sigue_como_dato, estado_postulacion, consentimiento, medio_consentimiento,
#                               aprobacion_bloqueada, archivos_a_la_empresa[], numero_guardado}  (#160: tablero propio con
#                               SQLite y outbox temporales, sin Twilio ni LLM real; solo se comparan las claves esperadas)
#   punta_a_punta               entrada {caso_ruta, sensibles[]} -> esperado {listas_cortas {oferta: [perfiles]}, enviadas[]
#                               ("perfil@oferta"), archivos_por_pareja {"perfil@oferta": [cv, carta, ics]},
#                               mensajes_a_la_empresa, datos_sensibles[]}  (grafo real: perfil -> matching -> aprobación
#                               con consentimiento -> postulación -> outbox, sin LLM)
#
# Las categorías postulacion, reacomodo, formacion y punta_a_punta (#225) usan data/cursos.csv, data/traslados.csv y
# tests/fixtures/caso_yaritza.json, ya en main. Escriben solo en carpetas temporales.
#
# La taxonomía vigente se carga del CSV al ejecutar los casos.

version: 1

categorias:
  extraccion_ofertas:
    issue: 5
    usa_llm: true
    metrica: "Fracción de corridas en que los campos esperados salen todos correctos (puesto, empresa, corregimiento, salario_mensual, habilidades)"
    meta: 0.80
  requisitos_discriminatorios:
    issue: 5
    usa_llm: false
    metrica: "Bloqueada, regla (art. 1 / art. 2) y alertas iguales a lo esperado"
    meta: 1.0
  perfil_sin_cv:
    issue: 6
    usa_llm: true
    metrica: "Habilidades esperadas encontradas con evidencia literal y 0 habilidades sin evidencia"
    meta: 0.75
  matching_factible:
    issue: 4
    usa_llm: false
    metrica: "Asignación igual a la calculada a mano y 0 violaciones duras"
    meta: 1.0
  sesgo_contrafactual:
    issue: 8
    usa_llm: false
    metrica: "sesgo_detectado igual a lo esperado"
    meta: 1.0
  guardrails:
    issue: 9
    usa_llm: false
    metrica: "Veredicto (rechazar | marcar | fuera_de_alcance | aceptar) igual a lo esperado y sin llamar al LLM cuando se rechaza"
    meta: 1.0
  horario_tirilla:
    issue: 164
    usa_llm: true
    metrica: "La tirilla sintética da exactamente el horario_clases, las excepciones y la vigencia esperados, sin problemas"
    meta: 1.0
  horario_validacion:
    issue: 164
    usa_llm: false
    metrica: "Los bloques inválidos se rechazan (índice y campo) y los válidos dan el horario_clases esperado"
    meta: 1.0
  redactor_puente:
    issue: 157
    usa_llm: false
    metrica: "El texto propuesto pasa revisar_texto sin hallazgos, con los cambios esperados, y los viables antes y después son los calculados a mano con las restricciones duras del solver"
    meta: 1.0
  micromision:
    issue: 158
    usa_llm: false
    metrica: "Resultado y puntaje del reto calculados en código iguales a lo esperado; mismo puntaje con nombre y género cambiados; scorecard sin datos personales"
    meta: 1.0
  postulacion:
    issue: 225
    usa_llm: false
    metrica: "Sin consentimiento no se genera nada; con consentimiento salen CV, carta, .ics y mensaje, y ninguno trae edad, corregimiento, estado civil ni hijos"
    meta: 1.0
  reacomodo:
    issue: 225
    usa_llm: false
    metrica: "Tras el rechazo de la empresa: pareja excluida, aviso al joven, lista nueva sin esa persona y aprobación pendiente"
    meta: 1.0
  formacion:
    issue: 225
    usa_llm: false
    metrica: "Cursos iguales a los calculados a mano, con cupo, horario sin cruce con las clases, traslado de hasta 60 min y pasaje dentro del presupuesto"
    meta: 1.0
  punta_a_punta:
    issue: 225
    usa_llm: false
    metrica: "Listas cortas iguales a las calculadas a mano y, tras aprobar con consentimiento, CV, carta e .ics por pareja en outbox, sin datos sensibles"
    meta: 1.0
  whatsapp:
    issue: 160
    usa_llm: false
    metrica: "Por el chatbot de WhatsApp: el NO al consentimiento deja la postulación en no_seleccionado y no sale nada a la empresa; la inyección solo se marca y el texto sigue como dato; el número nunca se guarda"
    meta: 1.0

casos:
  # ------------------------------------------------------------------ Extracción de ofertas (5)
  - id: EXT-01
