        cambio_hecho: "Causa: la extracción sí traía las tres («acomodar productos en estantes», «recibir mercancía», «control de inventario»), pero la normalización a la taxonomía era solo exacta y descartó las dos primeras («acomodar productos», «recibir mercancías»). Mercado usa ahora, si no hay coincidencia exacta, buscar_habilidades de puente/rules/taxonomia.py: compara raíces (sin palabras vacías, plural, infinitivo ni -ción) y acepta una frase que contiene un nombre de dos o más palabras. Perfil sigue con la coincidencia exacta. Sin cambiar taxonomia.csv, prompt ni grabación (#153); esperado original conservado"
        issue: "#153"
        nueva_ejecucion: "2026-10-17 00:30, evals.run en modo reproducir con la grabación de Claude: ok, habilidades [reposicion_productos, recepcion_mercancia, inventario]"

