# Casos de evaluación de Puente (issue #13).
#
# Reglas del archivo:
# - El resultado "esperado" de cada caso se escribió ANTES de correrlo (campo escrito_el) y se calculó
#   a mano o con la ley en la mano; nunca se copia de lo que devuelve el sistema.
# - Los casos no se borran. Cada fallo se anota en "fallos" con la fecha, lo observado, el cambio
#   hecho, el issue "bug" y la nueva ejecución. El runner (evals/run.py) nunca reescribe este archivo.
# - Todos los datos son SINTÉTICOS: personas, empresas, cédulas y teléfonos son inventados
#   (datos_sinteticos: true). Los traslados y salarios de los casos de matching y sesgo van en línea:
#   NO dependen de data/traslados.csv ni de ninguna otra carpeta data/.
# - Las metas por categoría son PROPUESTAS PROVISIONALES: el issue dice "ver plan" y ese plan no está
#   en el repositorio. El equipo debe confirmarlas.
# - Los skill_id son los de data/taxonomia.csv del issue #3 (atencion_cliente, manejo_caja, inventario,
#   recepcion_mercancia, reposicion_productos, registro_datos, excel_basico, limpieza, ...).
#   La taxonomía en línea de abajo es copia LITERAL de esa tabla (rama issue-3-datos-puente, PR #27), con sus
#   mismos sinónimos: no se agregaron sinónimos tomados de los textos de los casos, para que la tasa de
#   extracción y de perfil no salga inflada frente al sistema de la demo.
# - Reglas legales (Ley 11 de 2005): art. 2 = límite de edad (bloquea); art. 1 = exigencia de sexo
#   (bloquea); "buena presencia", foto y estado civil solo alertan. Falta revisión legal humana.
#
# Formato de las entradas y de lo esperado, por categoría:
#   extraccion_ofertas          entrada.texto -> esperado {puesto, empresa, corregimiento, salario_mensual, habilidades[]}
#   requisitos_discriminatorios entrada.texto -> esperado {bloqueada, reglas[] ("art. 1" | "art. 2"), alertas[] (presencia | foto | estado_civil)}
#   perfil_sin_cv               entrada {respuestas[] (hasta 5, en el orden de PREGUNTAS_ENTREVISTA de puente/agents/perfil.py:
#                               1 edad y corregimiento, 2 estudio o trabajo y horario, 3 negocio o ayuda en casa,
#                               4 voluntariado o comunidad, 5 qué sabe hacer y salario mínimo),
#                               formulario {nombre, edad, corregimiento}} -> esperado {habilidades[], no_incluir[], sin_pii[]}
#                               (sin_pii: datos que NO pueden aparecer ni en la evidencia ni en el prompt que recibe el LLM)
#   matching_factible           entrada {config, traslados[], perfiles[], ofertas[]} -> esperado {asignacion{perfil: oferta|null}, violaciones_duras}
#   sesgo_contrafactual         entrada {matching, traslados[], perfiles[], ofertas[]} -> esperado {sesgo_detectado}
#   guardrails                  entrada {tipo, ...} -> esperado {veredicto, llamo_llm?, sigue_como_dato?}
#
# Taxonomía en línea (clave "taxonomia"): copia literal de data/taxonomia.csv de #3 (rama issue-3-datos-puente).
# Vive aquí porque ese archivo todavía no está en main; los agentes la reciben por inyección. Cuando se fusione
# #27, medir con data/taxonomia.csv y borrar esta copia.

version: 1

categorias:
  extraccion_ofertas:
    issue: 5
    usa_llm: true
    metrica: "Fracción de corridas en que los campos esperados salen todos correctos (puesto, empresa, corregimiento, salario_mensual, habilidades)"
    meta: 0.80
  requisitos_discriminatorios:
    issue: 5
    usa_llm: false
    metrica: "Bloqueada, regla (art. 1 / art. 2) y alertas iguales a lo esperado"
    meta: 1.0
  perfil_sin_cv:
    issue: 6
    usa_llm: true
    metrica: "Habilidades esperadas encontradas con evidencia literal y 0 habilidades sin evidencia"
    meta: 0.75
  matching_factible:
    issue: 4
    usa_llm: false
    metrica: "Asignación igual a la calculada a mano y 0 violaciones duras"
    meta: 1.0
  sesgo_contrafactual:
    issue: 8
    usa_llm: false
    metrica: "sesgo_detectado igual a lo esperado"
    meta: 1.0
  guardrails:
    issue: 9
    usa_llm: false
    metrica: "Veredicto (rechazar | marcar | fuera_de_alcance | aceptar) igual a lo esperado y sin llamar al LLM cuando se rechaza"
    meta: 1.0

taxonomia:
  atencion_cliente: {nombre_es: asistir a clientes, sinonimos: [atención al cliente, servicio al cliente, atender clientes], uri_esco: "http://data.europa.eu/esco/skill/61970f8b-099c-4e7e-82e0-9ccdced0baf3"}
  manejo_caja: {nombre_es: manejar una caja registradora, sinonimos: [cobro en caja, cajero, cobrar], uri_esco: "http://data.europa.eu/esco/skill/0cb013af-6dd9-4fb2-b34e-63dda1a5cf82"}
  inventario: {nombre_es: gestionar el inventario, sinonimos: [control de inventario, conteo de existencias, stock], uri_esco: "http://data.europa.eu/esco/skill/ab6265f2-a9bf-49e8-a9a5-67cbab4de38b"}
  recepcion_mercancia: {nombre_es: recibir mercancías, sinonimos: [recepción de mercancía, recibir productos], uri_esco: "http://data.europa.eu/esco/skill/2cae39d6-78c2-4ce3-bee8-628504371463"}
  reposicion_productos: {nombre_es: colocar las mercancías en las estanterías, sinonimos: [reposición, surtir estantes, acomodar productos], uri_esco: "http://data.europa.eu/esco/skill/7e9daad3-8604-4839-af9b-dc6f8db3ef68"}
  registro_datos: {nombre_es: procesar datos, sinonimos: [registro de datos, entrada de datos, captación de datos], uri_esco: "http://data.europa.eu/esco/skill/f2d57f41-43b4-4f5b-8100-3df5c21eda50"}
  excel_basico: {nombre_es: utilizar hojas de cálculo, sinonimos: [Excel básico, hojas de cálculo, planillas], uri_esco: "http://data.europa.eu/esco/skill/1225b032-7ead-464c-9072-64097d9a4b62"}
  limpieza: {nombre_es: realizar tareas de limpieza, sinonimos: [aseo, limpiar superficies, desinfección], uri_esco: "http://data.europa.eu/esco/skill/1448431a-4fe5-4ca3-83db-665e0df3f130"}
  despacho_mercancia: {nombre_es: preparar los pedidos para el envío, sinonimos: [despacho, separar pedidos, preparar entregas], uri_esco: "http://data.europa.eu/esco/skill/ee5e2297-39cc-4ed6-89e5-d58016118a7f"}
  ventas_mostrador: {nombre_es: vender productos, sinonimos: [ventas de mostrador, ventas en tienda, ofrecer productos], uri_esco: "http://data.europa.eu/esco/skill/29a50780-f81b-429c-b410-7f23a492e19d"}
  archivo_documentos: {nombre_es: archivar documentos, sinonimos: [archivo, organizar formularios, gestión documental], uri_esco: "http://data.europa.eu/esco/skill/3d427a49-4f85-42cd-8a92-62d4a34f41a1"}
  trabajo_equipo: {nombre_es: trabajar en equipo, sinonimos: [colaboración, trabajo colaborativo], uri_esco: "http://data.europa.eu/esco/skill/c291acb4-6992-46ff-bf72-681eb378daa5"}

