  # ------------------------------------------------------------------ Matching factible (3)
  # Convenciones: pasaje diario = 2 x pasaje de ida; pasaje mensual = pasaje diario x 22 días.
  # Restricciones duras: traslado <= 60 min, pasaje mensual <= 15 % del salario, pasaje diario <= presupuesto,
  # sin cruce de horario con clases ni salirse del horario libre, salario >= salario mínimo, k = 3 por vacante.
  - id: MAT-01
    categoria: matching_factible
    descripcion: >-
      Yaritza (ficticia, La Chorrera, estudia de noche, presupuesto 3.00 al día). La oferta de Tocumen paga más
      pero se descarta (95 min > 60 y pasaje diario 4.70 > 3.00); queda la de La Chorrera.
    entrada:
      config: {max_vacantes_por_perfil: 1}
      traslados:
        - {origen: La Chorrera, destino: Tocumen, minutos: 95, pasaje_ida: 2.35}
        - {origen: La Chorrera, destino: La Chorrera, minutos: 15, pasaje_ida: 0.50}
      perfiles:
        - id: yaritza
          nombre: Yaritza Ficticia
          genero: femenino
          edad: 20
          corregimiento: La Chorrera
          salario_minimo: 400
          presupuesto_pasaje_diario: 3.00
          horario_libre:
            - {dias: [lunes, martes, miercoles, jueves, viernes], hora_inicio: "06:00", hora_fin: "18:00"}
          horario_clases:
            - {dias: [lunes, martes, miercoles, jueves, viernes], hora_inicio: "18:00", hora_fin: "22:00"}
          habilidades:
            - {skill_id: atencion_cliente, evidencia: atiendo a los clientes}
            - {skill_id: manejo_caja, evidencia: cobro en caja}
            - {skill_id: inventario, evidencia: control del inventario}
      ofertas:
        - id: OF-TOCUMEN
          puesto: Cajero
          empresa: Almacén Ficticio Este
          corregimiento: Tocumen
          salario_mensual: 600
          horario: {dias: [lunes, martes, miercoles, jueves, viernes], hora_inicio: "08:00", hora_fin: "16:00"}
          habilidades: [manejo_caja, atencion_cliente]
        - id: OF-CHORRERA
          puesto: Cajero
          empresa: Super Rio Ficticio
          corregimiento: La Chorrera
          salario_mensual: 450
          horario: {dias: [lunes, martes, miercoles, jueves, viernes], hora_inicio: "08:00", hora_fin: "16:00"}
          habilidades: [manejo_caja, atencion_cliente]
    esperado:
      asignacion: {yaritza: OF-CHORRERA}
      violaciones_duras: 0
    escrito_el: "2026-10-16"
    datos_sinteticos: true
    fallos: []

  - id: MAT-02
    categoria: matching_factible
    descripcion: >-
      Cuatro candidatos (cobertura 100, 75, 50 y 25 %) para una sola vacante con k = 3: quedan los tres de mayor
      puntaje y el de menor cobertura se queda sin vacante. Puntajes a mano: 100-15, 75-15, 50-15, 25-15.
    entrada:
      config: {max_vacantes_por_perfil: 1}
      traslados:
        - {origen: La Chorrera, destino: La Chorrera, minutos: 15, pasaje_ida: 0.50}
      perfiles:
        - id: p1
          nombre: Joven Ficticio Uno
          genero: femenino
          edad: 22
          corregimiento: La Chorrera
          salario_minimo: 300
          presupuesto_pasaje_diario: 3.00
          horario_libre:
            - {dias: [lunes, martes, miercoles, jueves, viernes], hora_inicio: "06:00", hora_fin: "22:00"}
          horario_clases: []
          habilidades:
            - {skill_id: atencion_cliente, evidencia: atiendo clientes}
            - {skill_id: manejo_caja, evidencia: cobro en caja}
            - {skill_id: inventario, evidencia: cuento el inventario}
            - {skill_id: ventas_mostrador, evidencia: vendo en el mostrador}
        - id: p2
          nombre: Joven Ficticio Dos
          genero: masculino
          edad: 21
          corregimiento: La Chorrera
          salario_minimo: 300
          presupuesto_pasaje_diario: 3.00
          horario_libre:
            - {dias: [lunes, martes, miercoles, jueves, viernes], hora_inicio: "06:00", hora_fin: "22:00"}
          horario_clases: []
          habilidades:
            - {skill_id: atencion_cliente, evidencia: atiendo clientes}
            - {skill_id: manejo_caja, evidencia: cobro en caja}
            - {skill_id: inventario, evidencia: cuento el inventario}
        - id: p3
          nombre: Joven Ficticio Tres
          genero: femenino
          edad: 19
          corregimiento: La Chorrera
          salario_minimo: 300
          presupuesto_pasaje_diario: 3.00
