    fallos:
      - fecha: "2026-10-16"
        observado: "grabando con Claude en vivo: mercado no devolvió ninguna oferta (HTTP 400 «Schema is too complex» al pedir OfertaExtraida)"
        cambio_hecho: "pendiente: simplificar el esquema o el pedido de Mercado (#137) y volver a grabar"
