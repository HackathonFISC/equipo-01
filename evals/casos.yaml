    categoria: matching_factible
    descripcion: >-
      Yaritza (ficticia, La Chorrera, estudia de noche, presupuesto 3.00 al día). La oferta de Tocumen paga más
      pero se descarta (95 min > 60 y pasaje diario 4.70 > 3.00); queda la de La Chorrera.
    entrada:
      config: {}
      traslados:
        - {origen: La Chorrera, destino: Tocumen, minutos: 95, pasaje_ida: 2.35}
        - {origen: La Chorrera, destino: La Chorrera, minutos: 15, pasaje_ida: 0.50}
      perfiles:
        - id: yaritza
