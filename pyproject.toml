[project]
name = "puente"
version = "0.1.0"
description = "Sistema agéntico de inserción laboral juvenil — Hackathon FISC AI Agents 2026, Reto 3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "fpdf2",
    "ics",
    "langchain-google-genai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langsmith",
    "ortools",
    "pydantic",
    "pypdf>=6.21.0",
    "python-dotenv",
    "python-multipart>=0.0.32",
    "pyyaml",
    "starlette",
    "uvicorn",
]

[dependency-groups]
dev = ["httpx", "pytest"]
# OCR local para leer CVs en foto (#274). Va aparte para que no entre al paquete de Vercel, que pasa de 500 MB con
# onnxruntime; ahí la demo es de solo lectura y no se suben fotos (#317). `uv sync` lo instala igual en local.
ocr = ["rapidocr-onnxruntime>=1.4.4"]

[tool.uv]
default-groups = ["dev", "ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
