[project]
name = "puente"
version = "0.1.0"
description = "Sistema agéntico de inserción laboral juvenil — Hackathon FISC AI Agents 2026, Reto 3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "fpdf2",
    "ics",
    "langchain-google-genai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langsmith",
    "ortools",
    "pydantic",
    "pypdf>=6.21.0",
    "python-dotenv",
    "python-multipart>=0.0.32",
    "pyyaml",
    "starlette",
    "uvicorn",
]

[dependency-groups]
dev = ["httpx", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
